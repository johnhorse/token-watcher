<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("token_watcher_theme");
          if (t === "slate" || t === "mint" || t === "meter-face") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>token-watcher</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
