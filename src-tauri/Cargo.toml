[package]
name = "token-watcher"
version = "0.1.1"
description = "Cross-platform AI token usage monitor for Claude Code — menu bar + floating widget"
authors = ["johnhorse"]
license = "MIT"
edition = "2021"
# 依赖树里的 tauri 2.12 / tray-icon / muda 要求 Rust >= 1.90
rust-version = "1.90"
repository = "https://github.com/johnhorse/token-watcher"
readme = "../README.md"
keywords = ["claude-code", "token-usage", "tauri", "monitor", "desktop"]
categories = ["gui", "visualization", "development-tools"]

# D14: 单 crate 双 bin —— GUI 主程序 + tw-ingest 开发工具，core 经显式 [lib] 共享
[lib]
name = "token_watcher_lib"
# 仅桌面（macOS/Windows）分发：bin 以 rlib 链接；staticlib/cdylib 是移动端打包要求
crate-type = ["rlib"]

[[bin]]
name = "token-watcher"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# D15 单实例守卫：第二实例唤起主窗后退出（必须最先注册的插件）
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
# T5 托盘菜单 i18n：系统语言检测（zh* → 中文，其余英文）
sys-locale = "0.3"
home = "0.5"

[profile.release]
codegen-units = 1
lto = true
strip = true
