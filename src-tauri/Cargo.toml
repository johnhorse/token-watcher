[package]
name = "token-watcher"
version = "0.1.0"
description = "Cross-platform AI token usage monitor for Claude Code — menu bar + floating widget"
authors = ["johnhorse"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

# D14: 单 crate 双 bin —— GUI 主程序 + tw-ingest 开发工具，core 经显式 [lib] 共享
[lib]
name = "token_watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "token-watcher"
path = "src/main.rs"

# 开发/验证工具，不入安装包（bundle 只打包主 bin）
[[bin]]
name = "tw-ingest"
path = "src/tw_ingest.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
home = "0.5"

[profile.release]
codegen-units = 1
lto = true
strip = true
