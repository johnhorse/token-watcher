<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="bezel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cyber-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="quantum-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="core-glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow-base" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base Squircle Container (macOS / Desktop Icon Canvas) -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg-glow)" filter="url(#shadow-base)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="url(#bezel-metal)" stroke-width="8" opacity="0.8"/>
  <rect x="72" y="72" width="880" height="880" rx="192" fill="none" stroke="#000000" stroke-width="4" opacity="0.6"/>

  <!-- Cybernetic Radar Grid & Telemetry Markings -->
  <g opacity="0.25">
    <circle cx="512" cy="512" r="380" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 12"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="220" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 8"/>
    <line x1="512" y1="132" x2="512" y2="892" stroke="#64748b" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="132" y1="512" x2="892" y2="512" stroke="#64748b" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <!-- Outer Bezel Telemetry Scale & Ticks -->
  <g id="dial-ticks">
    <!-- 12 Major Radial Dial Markers -->
    <g stroke="url(#cyber-amber)" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="512" y1="150" x2="512" y2="178"/>
      <line x1="512" y1="846" x2="512" y2="874"/>
      <line x1="150" y1="512" x2="178" y2="512"/>
      <line x1="846" y1="512" x2="874" y2="512"/>
      
      <line x1="256" y1="256" x2="276" y2="276"/>
      <line x1="768" y1="768" x2="748" y2="748"/>
      <line x1="768" y1="256" x2="748" y2="276"/>
      <line x1="256" y1="768" x2="276" y2="748"/>
    </g>

    <!-- Additional fine ticks around the ring -->
    <g stroke="#38bdf8" stroke-width="2" opacity="0.4">
      <circle cx="512" cy="512" r="350" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 18"/>
    </g>
  </g>

  <!-- Segmented Sci-Fi Data Arc Rings -->
  <g>
    <!-- Cyan Upper Data Arc -->
    <path d="M 280 340 A 320 320 0 0 1 744 340" fill="none" stroke="url(#quantum-cyan)" stroke-width="6" stroke-linecap="round" filter="url(#glow-cyan)"/>
    <circle cx="280" cy="340" r="5" fill="#38bdf8" filter="url(#glow-cyan)"/>
    <circle cx="744" cy="340" r="5" fill="#38bdf8" filter="url(#glow-cyan)"/>

    <!-- Amber Lower Segmented Ring -->
    <path d="M 744 684 A 320 320 0 0 1 280 684" fill="none" stroke="url(#cyber-amber)" stroke-width="6" stroke-linecap="round" stroke-dasharray="32 16" opacity="0.9"/>
  </g>

  <!-- Central Sci-Fi "Watcher's Eye" Aperture Brackets -->
  <g stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.9">
    <!-- Left Bracket -->
    <path d="M 320 440 L 290 470 L 290 554 L 320 584" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Bracket -->
    <path d="M 704 440 L 734 470 L 734 554 L 704 584" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Hexagonal Token Matrix Core Base -->
  <g transform="translate(512, 512)">
    <!-- Rotating Ring Glow Aura -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#cyber-amber)" stroke-width="2" stroke-dasharray="16 12" opacity="0.6"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#quantum-cyan)" stroke-width="3" stroke-dasharray="60 30" opacity="0.8"/>

    <!-- Outer Quantum Pulse Energy Nodes (6 Hexagonal Satellite Nodes) -->
    <g fill="#38bdf8" filter="url(#glow-cyan)">
      <circle cx="0" cy="-130" r="6"/>
      <circle cx="112" cy="-65" r="5"/>
      <circle cx="112" cy="65" r="5"/>
      <circle cx="0" cy="130" r="6"/>
      <circle cx="-112" cy="65" r="5"/>
      <circle cx="-112" cy="-65" r="5"/>
    </g>

    <!-- Deep Ambient Glow behind Monolith -->
    <circle cx="0" cy="0" r="110" fill="#f59e0b" opacity="0.22" filter="url(#glow-heavy)"/>
    <circle cx="0" cy="0" r="70" fill="#38bdf8" opacity="0.28" filter="url(#glow-cyan)"/>

    <!-- Core Geometric Glyph: Token Watcher "T" + "W" + Aperture Eye -->
    <!-- Stylized Futuristic Token Crystal (Hex Prism Facets) -->
    <!-- Top Bar (The "T" Bar & Upper Token Shield) -->
    <path d="M -90 -80 L 90 -80 L 110 -40 L 40 -40 L 40 40 L -40 40 L -40 -40 L -110 -40 Z" 
          fill="url(#core-glow-grad)" filter="url(#glow-heavy)" opacity="0.95"/>
    <path d="M -90 -80 L 90 -80 L 110 -40 L 40 -40 L 40 40 L -40 40 L -40 -40 L -110 -40 Z" 
          fill="url(#core-glow-grad)" stroke="#ffffff" stroke-width="3"/>

    <!-- Lower "W" Wings (Cybernetic Watcher Wings) -->
    <path d="M -110 -15 L -65 85 L -35 25 L 0 75 L 35 25 L 65 85 L 110 -15 L 80 -15 L 50 50 L 25 -5 L -25 -5 L -50 50 L -80 -15 Z" 
          fill="url(#quantum-cyan)" opacity="0.9" stroke="#ffffff" stroke-width="2" filter="url(#glow-cyan)"/>

    <!-- Central Neural Eye / Token Core (Glowing Hex Diamond) -->
    <polygon points="0,-35 32,0 0,35 -32,0" fill="#ffffff" filter="url(#glow-cyan)"/>
    <polygon points="0,-20 18,0 0,20 -18,0" fill="#fde047"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>

    <!-- Floating Pulse Energy Orbit Arc -->
    <ellipse cx="0" cy="0" rx="150" ry="50" fill="none" stroke="url(#quantum-cyan)" stroke-width="2.5" 
             stroke-dasharray="80 120" transform="rotate(-25)" opacity="0.85" filter="url(#glow-cyan)"/>
  </g>

  <!-- Sci-Fi Corner Bracket Accents -->
  <g stroke="#475569" stroke-width="3" fill="none" opacity="0.6">
    <path d="M 120 160 L 120 120 L 160 120"/>
    <path d="M 904 160 L 904 120 L 864 120"/>
    <path d="M 120 864 L 120 904 L 160 904"/>
    <path d="M 904 864 L 904 904 L 864 904"/>
  </g>

  <!-- Technical Labeling (Meter Face Typography) -->
  <text x="512" y="810" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', monospace" 
        font-size="28" font-weight="700" fill="#94a3b8" letter-spacing="12" text-anchor="middle" opacity="0.85">
    TOKEN WATCHER
  </text>
  <text x="512" y="838" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', monospace" 
        font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="6" text-anchor="middle" opacity="0.75">
    QUANTUM TELEMETRY
  </text>
</svg>
